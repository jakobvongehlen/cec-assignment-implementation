# Demo stack: database, 16 consumers (incl. notifier), REST API and monitoring.
# Credentials (Kafka certs + notification token) are expected in ./auth.
# Settings shared by the consumers below
x-consumer: &consumer
  build: ./src/consumer
  image: cec-consumer
  # demo data is produced to the shared `experiment` topic
  command: ["single_consumer.py", "${CONSUMER_TOPIC:-experiment}"]
  environment:
    # the course service; for tests on group11 a local one, see src/consumer/README.md
    NOTIFICATIONS_HOST: ${NOTIFICATIONS_HOST:-https://notifications.cec.dlandau.nl}
    # Kafka static membership: each consumer joins with its hostname, so a
    # restarted consumer gets its own partition back instead of a rebalance
    STATIC_MEMBERSHIP: "true"
  volumes:
    - ./auth:/usr/src/app/auth:ro
    - ./logs:/usr/src/app/logs
  depends_on:
    mypg:
      condition: service_healthy
  # time to commit when stopped
  stop_grace_period: 30s
  restart: unless-stopped

services:
  mypg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: cec
      POSTGRES_DB: temp_db
    ports:
      - "5432:5432"
    volumes:
      - ./src/consumer/db_queries.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temp_db"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  # 16 consumers, one per partition of the topic, see src/consumer/README.md.
  # They share the work through the Kafka consumer group and the experiment state
  # in Postgres. All of them run the same image (cec-consumer).
  consumer_1: {<<: *consumer, hostname: consumer-1}
  consumer_2: {<<: *consumer, hostname: consumer-2}
  consumer_3: {<<: *consumer, hostname: consumer-3}
  consumer_4: {<<: *consumer, hostname: consumer-4}
  consumer_5: {<<: *consumer, hostname: consumer-5}
  consumer_6: {<<: *consumer, hostname: consumer-6}
  consumer_7: {<<: *consumer, hostname: consumer-7}
  consumer_8: {<<: *consumer, hostname: consumer-8}
  consumer_9: {<<: *consumer, hostname: consumer-9}
  consumer_10: {<<: *consumer, hostname: consumer-10}
  consumer_11: {<<: *consumer, hostname: consumer-11}
  consumer_12: {<<: *consumer, hostname: consumer-12}
  consumer_13: {<<: *consumer, hostname: consumer-13}
  consumer_14: {<<: *consumer, hostname: consumer-14}
  consumer_15: {<<: *consumer, hostname: consumer-15}
  consumer_16: {<<: *consumer, hostname: consumer-16}

  # API_IMPL=rust (the default, set in .env) deploys src/http-api-rust; API_IMPL= (empty) deploys the Python API in src/http-api
  api:
    build: ./src/http-api${API_IMPL:+-$API_IMPL}
    image: http-api${API_IMPL:+-$API_IMPL}
    environment:
      # one uvicorn worker (Python) or thread (Rust) per core; total DB connections = WORKERS * POOL_SIZE
      WORKERS: ${API_WORKERS:-2}
      POOL_SIZE: ${API_POOL_SIZE:-10}
    # one file per client connection; Docker's default of 1,024 ran out at
    # ~1,000 connections in the load test (loadtest/README.md)
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    ports:
      - "3003:3003"
    depends_on:
      mypg:
        condition: service_healthy
    restart: unless-stopped

  # --- monitoring, see monitoring/README.md ---------------------------------

  # The course Prometheus federates the node_* metrics from <vm-ip>:3008
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # the VM disk is small
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "3008:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  # VM CPU, memory, network and disk; host namespaces so it sees the VM, not itself
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped

  # CPU, memory and network per container
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      # only cpu, memory and network are collected
      - --disable_metrics=advtcp,app,cpuLoad,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  # Cost and bottleneck dashboard on :3010. It is public, so nobody can log in:
  # everyone is an anonymous viewer that can also use Explore. Change the
  # dashboard in monitoring/grafana/dashboard.py instead of the UI.
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_DISABLE_LOGIN: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/temperature-observability.json
    ports:
      - "3010:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
