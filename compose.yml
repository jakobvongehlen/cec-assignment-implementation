  api:
    build: ./src/http-api
    environment:
      # one uvicorn worker per core; each keeps POOL_SIZE DB connections
      WORKERS: ${API_WORKERS:-2}
      POOL_SIZE: ${API_POOL_SIZE:-10}
    ports:
      - "3003:3003"
    depends_on:
      mypg:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
