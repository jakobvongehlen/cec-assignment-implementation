# Demo stack: database, consumer (incl. notifier) and REST API.
# Credentials (Kafka certs + notification token) are expected in ./auth.
services:
  mypg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: cec
      POSTGRES_DB: temp_db
    ports:
      - "5432:5432"
    volumes:
      - ./src/consumer/db_queries.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temp_db"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  consumer_1:
    build: ./src/consumer
    # demo data is produced to the shared `experiment` topic
    command: ["single_consumer.py", "${CONSUMER_TOPIC:-experiment}"]
    environment:
      NOTIFICATIONS_HOST: https://notifications.cec.dlandau.nl
    volumes:
      - ./auth:/usr/src/app/auth:ro
      - ./logs:/usr/src/app/logs
    depends_on:
      mypg:
        condition: service_healthy
    restart: unless-stopped

