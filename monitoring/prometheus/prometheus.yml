# Prometheus for the Temperature Observability service, published on :3008.
# The course Prometheus federates node_cpu_seconds_total and node_memory_* from
# <vm-ip>:3008/federate for the "Average CPU/Memory" panels in the course Grafana.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # VM CPU, memory, network and disk
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # CPU and memory per container
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # keep containers only, the host totals come from node_exporter
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop

  # App metrics of the 16 consumers (compose services consumer_1 ... consumer_16)
  - job_name: consumer
    static_configs:
      - targets: ["consumer_1:8000", "consumer_2:8000", "consumer_3:8000", "consumer_4:8000", "consumer_5:8000", "consumer_6:8000", "consumer_7:8000", "consumer_8:8000", "consumer_9:8000", "consumer_10:8000", "consumer_11:8000", "consumer_12:8000", "consumer_13:8000", "consumer_14:8000", "consumer_15:8000", "consumer_16:8000"]
    relabel_configs:
      # instance="consumer_1" instead of "consumer_1:8000"
      - source_labels: [__address__]
        regex: (.*):8000
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
