# Prometheus for the Temperature Observability service, published on :3008.
# The course Prometheus federates node_cpu_seconds_total and node_memory_* from
# <vm-ip>:3008/federate for the "Average CPU/Memory" panels in the course Grafana.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # VM CPU, memory, network and disk
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # CPU and memory per container
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # keep containers only, the host totals come from node_exporter
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop

  # App metrics of every consumer container, however many are running:
  # consumer_1 ... consumer_N, or one `consumer` service scaled with --scale
  - job_name: consumer
    scrape_interval: 5s
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: consumer(_\d+)?
        action: keep
      # one target per container, even if it publishes several ports
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: $1:8000
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
