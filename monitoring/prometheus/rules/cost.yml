# Estimated cost of the group VM (t3a.medium, eu-west-1, 20 GiB disk) in USD per
# hour, by component. Only CPU credits and outbound traffic grow with load.
# AWS on-demand prices; update them if the VM changes.
groups:
  - name: cost
    rules:
      # prices
      - record: cec:price_usd:instance_hour
        expr: vector(0.0408)  # t3a.medium
      - record: cec:price_usd:public_ipv4_hour
        expr: vector(0.005)
      - record: cec:price_usd:ebs_gib_month
        expr: vector(0.088)  # gp3
      - record: cec:price_usd:egress_gib
        expr: vector(0.09)  # to the internet, first 10 TB/month
      # CPU above the baseline, ignoring saved credits (worst case)
      - record: cec:price_usd:cpu_credit_vcpu_hour
        expr: vector(0.05)
      - record: cec:instance:baseline_vcpu_fraction
        expr: vector(0.2)  # t3a.medium baseline is 20% per vCPU

      # VM usage (node_exporter)
      - record: cec:node:vcpus
        expr: count(node_cpu_seconds_total{job="node", mode="idle"})
      - record: cec:node:vcpus_used
        expr: sum(rate(node_cpu_seconds_total{job="node", mode!~"idle|iowait|steal"}[1m]))
      - record: cec:node:memory_gib
        expr: sum(node_memory_MemTotal_bytes{job="node"}) / 2^30
      - record: cec:node:memory_used_gib
        expr: sum(node_memory_MemTotal_bytes{job="node"} - node_memory_MemAvailable_bytes{job="node"}) / 2^30
      - record: cec:node:disk_gib
        expr: sum(node_filesystem_size_bytes{job="node", mountpoint="/"}) / 2^30
      - record: cec:node:egress_bytes_per_second
        expr: sum(rate(node_network_transmit_bytes_total{job="node", device!~"lo|veth.*|docker.*|br-.*"}[1m]))

      # cost per component
      - record: cec:cost_usd_per_hour
        labels: {component: instance}
        expr: cec:price_usd:instance_hour
      - record: cec:cost_usd_per_hour
        labels: {component: public_ipv4}
        expr: cec:price_usd:public_ipv4_hour
      - record: cec:cost_usd_per_hour
        labels: {component: storage}
        expr: cec:node:disk_gib * scalar(cec:price_usd:ebs_gib_month) / 730
      - record: cec:cost_usd_per_hour
        labels: {component: cpu_credits}
        expr: >
          clamp_min(cec:node:vcpus_used - cec:node:vcpus * scalar(cec:instance:baseline_vcpu_fraction), 0)
          * scalar(cec:price_usd:cpu_credit_vcpu_hour)
      - record: cec:cost_usd_per_hour
        labels: {component: egress}
        expr: cec:node:egress_bytes_per_second * 3600 / 2^30 * scalar(cec:price_usd:egress_gib)
